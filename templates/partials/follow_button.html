{#
  Replacement for the "Monitor" button after an artist has been followed.
  Context: artist_id (str), followed (bool), name (str)
#}
{% if followed %}
<a class="btn btn--sm btn--quiet" href="/artists/{{ artist_id }}">Monitored ✓</a>
{% else %}
<form hx-post="/ui/artists/add" hx-target="this" hx-swap="outerHTML" hx-trigger="submit">
  <input type="hidden" name="artist_id" value="{{ artist_id }}">
  <input type="hidden" name="name" value="{{ name }}">
  <button class="btn btn--sm btn--primary" type="submit">Monitor artist</button>
</form>
{% endif %}
