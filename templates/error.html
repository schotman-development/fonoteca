{% extends "base.html" %}
{% block title %}{{ status_code }} · {{ app_name }}{% endblock %}
{% block heading %}{{ status_code }} — {{ title }}{% endblock %}

{% block content %}
<section class="card">
  <div class="card__body">
    <p class="muted" style="margin-top:0">{{ message }}</p>
    {% if detail %}
    <pre class="error-detail">{{ detail }}</pre>
    {% endif %}
    <div class="btn-row" style="margin-top:16px">
      <a class="btn btn--primary" href="/">Back to the dashboard</a>
      <a class="btn" href="/artists">Library</a>
    </div>
  </div>
</section>
{% endblock %}
