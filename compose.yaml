# The Docker path. On Podman, prefer deploy/fonoteca.container (Quadlet) —
# it gets native `podman auto-update` with no wrapper unit. See README.
services:
  fonoteca:
    # Release CI pushes this tag. To build your own instead:
    #   docker compose up --build
    image: ghcr.io/schotman-development/fonoteca:latest
    build: .
    restart: unless-stopped
    # QOBUZ_APP_ID and QOBUZ_USER_AUTH_TOKEN are required; copy .env.example to
    # .env first. Compose reads that same file for the ${...} defaults below.
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # A bind mount, not a named volume: the library stays yours to browse, add
      # to and back up from the host. Cannot be :ro — Fonoteca downloads into
      # it, and re-files, re-tags and trashes what is already there.
      - ${MUSIC_DIR:-./music}:/music
      # Database, logs, secret cache, trash, partial downloads. Also a bind
      # mount: it must survive `docker compose down -v`, and it is the thing
      # worth backing up.
      - ${DATA_DIR:-./data}:/data
    # The image runs as uid 1000, so both mounts must be writable by it. If your
    # host uid differs, set PUID/PGID in .env (`id -u`, `id -g`) rather than
    # chowning your music library.
    user: "${PUID:-1000}:${PGID:-1000}"
    # No healthcheck block: the image's HEALTHCHECK is inherited as-is, and a
    # copy here would just be a second place to forget to update.

# Updating is `docker compose pull && docker compose up -d`. There is
# deliberately no watchtower service: it wants /var/run/docker.sock, which is
# root-equivalent on the host, and it cannot roll back a bad :latest the way
# `podman auto-update` does. Not a fair trade for two words typed occasionally.
